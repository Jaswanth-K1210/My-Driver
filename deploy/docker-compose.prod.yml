# Single-host production stack: TLS proxy, API, website, operations console
# (its own subdomain), Postgres
# (TimescaleDB), PgBouncer and Redis. Object storage is external S3.
#
#   cp .env.production.example .env.production   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api node dist/db/migrate.js
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api node dist/db/seed.js
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Only Caddy publishes ports. The database, pooler and Redis are reachable
# from inside this network and nowhere else.

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '5' }

services:
  caddy:
    <<: *restart
    image: caddy:2.8-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web, admin]

  api:
    <<: *restart
    build: ../prototype/backend
    image: mydriver-api:${RELEASE:-latest}
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ADMIN_WEB_URL: https://${ADMIN_DOMAIN}
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
    # Draining waits 2 s for the proxy, then finishes in-flight work.
    stop_grace_period: 30s

  web:
    <<: *restart
    build:
      context: ../prototype/website
      args:
        VITE_API_URL: https://${API_DOMAIN}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_FEATURES: ${VITE_FEATURES:-}
    image: mydriver-web:${RELEASE:-latest}

  admin:
    <<: *restart
    build:
      context: ../prototype/website
      args:
        VITE_APP_TARGET: admin
        VITE_API_URL: https://${API_DOMAIN}
        VITE_PUBLIC_SITE_URL: https://${WEB_DOMAIN}
    image: mydriver-admin:${RELEASE:-latest}

  postgres:
    <<: *restart
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    <<: *restart
    image: edoburu/pgbouncer:${PGBOUNCER_TAG:-v1.23.1-p3}
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 25
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options,search_path
      AUTH_TYPE: plain
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    <<: *restart
    image: redis:7.4-alpine
    # Redis holds OTP challenges, rate limits and the live geo index; AOF keeps
    # them across a restart. Nothing durable lives only here.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
